# E3 case study: DRAFT configuration.
#
# Factors, ranges and responses are NOT final. They follow the team's case-study
# proposal (30 Oct 2026) and must be confirmed by the institute before any run
# sheet is sent to the lab. Change values here only; no code change is needed.

name = "E3 microalgal protein extraction (ultrasonic bath) - DRAFT"
seed = 2026          # fixes the shuffled run order; keep it once the sheet is issued

[design]
method = "bbd"       # bbd (3+ factors) | ccd_face | ccd_inscribed
center_points = 3    # replicated centre runs also estimate the lab noise

[[factors]]
name = "biomass"
label = "Biomass concentration"
unit = "g/L"
low = 10
high = 50
decimals = 1

[[factors]]
name = "time"
label = "Ultrasound time"
unit = "min"
low = 5
high = 20
decimals = 1

[[factors]]
name = "ph"            # PENDING: pH or temperature (25-40 C) as the third factor
label = "pH"
unit = ""
low = 7
high = 11
decimals = 1

[[responses]]
name = "soluble_protein"   # PENDING: primary response (g/L or yield per gram) not decided
unit = "g/L"
goal = "max"

[run_sheet]
record = ["bath_temp_start_C", "bath_temp_end_C"]
