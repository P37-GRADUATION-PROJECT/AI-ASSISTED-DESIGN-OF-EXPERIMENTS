[project]
name = "p37-doe-assistant"
version = "0.1.0"
description = "AI-assisted Design of Experiments web tool built on Bayesian optimization"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
